<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XenoLog</title>
<style>
/* Layout: one phone-width column, a sticky header, a fixed bottom tab bar; each screen is a short stack of rows. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --line: #d3dcda;
  --fg: #14282a;
  --muted: #5a6f70;
  --accent: #0f6e73;
  --accent-fg: #ffffff;
  --ok: #1f7a45;      --ok-bg: #dff1e6;
  --rest: #8a5a00;    --rest-bg: #f8ebcc;
  --use: #2b53a8;     --use-bg: #dfe7f8;
  --danger: #a8322b;  --danger-bg: #f8e0de;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-id: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1819; --surface: #172526; --line: #2b3d3e; --fg: #e3eceb; --muted: #93a8a8;
    --accent: #4fb8bd; --accent-fg: #06201f;
    --ok: #7ed3a0; --ok-bg: #173524; --rest: #e8c26a; --rest-bg: #3a2e10;
    --use: #9db8f2; --use-bg: #1b2a4a; --danger: #f09a93; --danger-bg: #401c19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1819; --surface: #172526; --line: #2b3d3e; --fg: #e3eceb; --muted: #93a8a8;
  --accent: #4fb8bd; --accent-fg: #06201f;
  --ok: #7ed3a0; --ok-bg: #173524; --rest: #e8c26a; --rest-bg: #3a2e10;
  --use: #9db8f2; --use-bg: #1b2a4a; --danger: #f09a93; --danger-bg: #401c19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
#app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; display: flex; flex-direction: column; gap: 14px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
header.top h1 { font-size: 17px; font-weight: 700; margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.back { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; padding: 6px 4px; cursor: pointer; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.demo { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.link { border: 0; background: none; color: var(--accent); font: inherit; font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 4px 0; }
h2 { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin: 6px 0 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.row.static { cursor: default; }
.row .grow, .grow { flex: 1; min-width: 0; }
.ttl { font-weight: 700; }
.sub { font-size: 12.5px; color: var(--muted); }
.id { font-family: var(--font-id); font-variant-numeric: tabular-nums; font-weight: 500; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.rest { background: var(--rest-bg); color: var(--rest); }
.pill.use { background: var(--use-bg); color: var(--use); }
.pill.off { background: var(--line); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-family: var(--font-id); font-size: 12.5px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); }
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.rest { background: var(--rest-bg); color: var(--rest); border-color: transparent; }
.chip.use { background: var(--use-bg); color: var(--use); border-color: transparent; }
.chip.next { box-shadow: 0 0 0 2px var(--accent); }
.row.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.row.none-ok { opacity: .6; }
.count { font-family: var(--font-id); font-size: 15px; font-weight: 500; white-space: nowrap; }
.ph { border-radius: 4px; display: block; flex: none; background: var(--line); }
.ph.fill { width: 100%; height: auto; aspect-ratio: 1; }
.ph[data-zoom] { cursor: zoom-in; }
#zoom { position: fixed; inset: 0; z-index: 8; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
#zoom .zin { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
#zoom p { margin: 0; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 700; padding: 11px 14px; border-radius: 6px; cursor: pointer; width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row .btn { width: auto; flex: none; padding: 8px 16px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 130px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label.seg:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.alert { border-radius: 6px; padding: 10px 12px; font-size: 13.5px; }
.alert.rest { background: var(--rest-bg); color: var(--rest); }
.alert.danger { background: var(--danger-bg); color: var(--danger); }
.alert.use { background: var(--use-bg); color: var(--use); }
.alert.ok { background: var(--ok-bg); color: var(--ok); }
.shot { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 10px 12px; }
.cand { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.cand .line { display: flex; align-items: center; gap: 12px; }
.sim { font-family: var(--font-id); font-size: 12.5px; color: var(--muted); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.basket { background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.tape { font-family: var(--font-id); background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--accent); padding: 10px 12px; font-size: 16px; display: flex; justify-content: space-between; gap: 12px; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp.big { grid-template-columns: 1fr; }
.cmp figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cmp figcaption { font-size: 12.5px; color: var(--muted); }
.cmp figcaption strong { color: var(--fg); }
.empty { aspect-ratio: 1; border: 1px dashed var(--line); border-radius: 4px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-size: 12.5px; color: var(--muted); }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.thumb { border: 2px solid transparent; background: none; padding: 2px; border-radius: 6px; font: inherit; color: var(--muted); font-size: 11.5px; cursor: pointer; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.thumb[aria-current="true"] { border-color: var(--accent); color: var(--fg); }
.switch { display: flex; gap: 6px; flex-wrap: wrap; }
.switch button { flex: 1 1 80px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; border-radius: 6px; padding: 7px 6px; cursor: pointer; }
.switch button[aria-current="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
form.rec { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span, fieldset legend { font-size: 12.5px; font-weight: 700; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
input[type=text], input[type=date], select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; }
.segs { display: flex; gap: 6px; flex-wrap: wrap; }
label.seg { flex: 1 1 60px; text-align: center; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 6px; cursor: pointer; font-weight: 500; }
label.seg input { position: absolute; opacity: 0; pointer-events: none; }
label.seg:has(input:checked) { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 700; }
td.chg { color: var(--accent); font-weight: 700; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 6; }
nav.tabs div { max-width: 520px; margin: 0 auto; display: flex; }
nav.tabs button { flex: 1; border: 0; background: none; font: inherit; color: var(--muted); padding: 12px 4px; font-weight: 700; cursor: pointer; border-top: 3px solid transparent; }
nav.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13.5px; z-index: 7; max-width: calc(100% - 32px); }

[hidden] { display: none !important; }
.ph { object-fit: cover; }
.ph.none { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10.5px; color: var(--muted); line-height: 1.2; }
.ph.fill.none { font-size: 12.5px; }
label.btn { display: block; text-align: center; }
label.btn input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
#busy { position: fixed; inset: 0; z-index: 9; background: color-mix(in srgb, var(--bg) 70%, transparent); display: flex; align-items: center; justify-content: center; font-weight: 700; }
.who { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
#cropper { position: fixed; inset: 0; z-index: 8; background: var(--bg); overflow-y: auto; }
#cropper .crop-in { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 0 24px; display: flex; flex-direction: column; gap: 12px; }
.crop-stage { position: relative; overflow: hidden; border-radius: 4px; line-height: 0; user-select: none; -webkit-user-select: none; }
.crop-stage img { width: 100%; display: block; pointer-events: none; }
#crop-frame { position: absolute; border: 2px solid var(--accent-fg); outline: 2px solid var(--accent); box-shadow: 0 0 0 2000px rgba(0, 0, 0, .5); touch-action: none; cursor: move; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.sr-file { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
/* Roster check result (rosterview.js), in the app and on the check page */
#app.wide { max-width: 960px; }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; }
.finding { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.groups, .photos { display: flex; flex-wrap: wrap; gap: 8px; }
.groups { gap: 12px; }
.photos figure { margin: 0; display: flex; flex-direction: column; gap: 4px; width: 132px; }
.photos img, .photos .noimg { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; background: var(--line); display: block; }
.photos figcaption { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.photos figcaption strong { color: var(--fg); }
.group { border-left: 3px solid var(--line); padding-left: 8px; }
table.bins { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; width: 100%; max-width: 560px; }
table.bins th, table.bins td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: right; }
table.bins th { vertical-align: bottom; }
table.bins th:first-child, table.bins td:first-child { text-align: left; }
details summary { cursor: pointer; font-size: 13.5px; }
details > div { margin-top: 8px; }
.btn.inline { width: auto; }
.heat { display: flex; flex-direction: column; gap: 8px; }
.heat-wrap { position: relative; overflow-x: auto; }
.heat canvas { display: block; cursor: pointer; }
.heat .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.heat .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 5px; }
.heat .legend i.zero { border: 1px solid var(--line); }
.heat .tip { position: absolute; z-index: 3; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 4px; max-width: 220px; }
.heat .tip strong { display: block; font-size: 13px; }
.open { all: unset; cursor: pointer; display: block; }
.chips .open { display: inline-block; }
.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="Main"><div id="tabs"></div></nav>
<div id="toast" role="status" hidden></div>
<div id="zoom" hidden></div>
<div id="cropper" hidden></div>
<!-- File inputs live outside #app so a re-render while the camera is open cannot detach them. -->
<input type="file" accept="image/*" capture="environment" id="file-cam" class="sr-file" tabindex="-1" aria-hidden="true">
<input type="file" accept="image/*" id="file-lib" class="sr-file" tabindex="-1" aria-hidden="true">
<div id="busy" role="status" hidden>Working...</div>
<div class="demo" id="demo-bar" style="max-width:520px;margin:0 auto;padding:8px 16px;box-sizing:border-box">
<span>Demo with a made-up colony. Nothing is saved.</span><a class="link" href="" id="demo-reset" style="white-space:nowrap">Start over</a></div>
<div id="demo-picker" hidden></div>
<style>#demo-picker { position: fixed; inset: 0; z-index: 8; background: var(--bg); overflow-y: auto; }
#demo-picker .crop-in { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 0 24px; display: flex; flex-direction: column; gap: 12px; }
#demo-picker .btnrow { flex-wrap: wrap; }</style>
<script>
/* In-memory stand-ins for the Apps Script services, so Code.gs can run in Node and in a plain browser page. */
(function (g) {
  function Range(sh, r, c, nr, nc) { this.sh = sh; this.r = r; this.c = c; this.nr = nr; this.nc = nc; }
  Range.prototype.getValues = function () { var o = []; for (var i = 0; i < this.nr; i++) { var row = []; for (var j = 0; j < this.nc; j++) { var v = (this.sh.data[this.r - 1 + i] || [])[this.c - 1 + j]; row.push(v === undefined ? '' : v); } o.push(row); } return o; };

  var book = { sheets: {}, getSheetByName: function (n) { return this.sheets[n] || null; }, insertSheet: function (n) { return (this.sheets[n] = new Sheet(n)); },
    getSpreadsheetTimeZone: function () { return 'America/Detroit'; }, toast: function () {} };

<script>
/* Made-up colony for the public demo (docs/demo/). Dates are counted back from today, so the demo looks the same whenever it is opened.
 * Loaded after fakes.js and before Code.gs (ROSTER), and demoSeed() runs after setup(). No real animal, person or photo is in here. */
var DEMO_DAY = 86400000;
function demoAgo(days) { var d = new Date(Date.now() - days * DEMO_DAY); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

// Squeezed quantity, appearance, Ca; laid quantity, appearance, Ca
var DEMO_GRADES = {
  great: ['Many', 'Great', 'Looking good', 'Normal', 'Good', 'Looking good'],
  good: ['Normal', 'Good', 'Looking good', 'Normal', 'Good', ''],
  fair: ['Few', 'Not bad', 'Looking good', 'Few', 'Good', ''],
  poor: ['Few', 'Bad', 'Turned to white', 'None', 'None', ''],
  bad: ['None', 'None', '', 'Few', 'Bad', 'Turned to white']
};
var DEMO_PEOPLE = ['alex', 'sam', 'kim'];

/* 50 frogs in the colony, used about 4 a week, as a lab does: with a 3-month rest that many are needed.
   The past is simulated week by week from a fixed seed, so the colony is the same on every visit:
   [{ id, tank, arrived (days ago), removed: {days, reason} | null, cycles: [{days, grade}] oldest first (grade null: not used), open: 'use' | 'rec' | null }] */
var DEMO_FROGS = (function () {
  var rnd = demoRandom(2026), REST = 92, PER_WEEK = 4, frogs = [], id;
  // [first ID, last ID, arrived days ago]
  [[1, 18, 640], [19, 36, 420], [37, 47, 230], [48, 50, 110], [51, 53, 10]].forEach(function (b) {
    for (id = b[0]; id <= b[1]; id++) frogs.push({ id: id, arrived: b[2], removed: null, cycles: [], open: null, last: null });

  name: { text: true, get: function (r) { return r.name; } },
  water: { text: true, get: function (r) { return r.water; } },
  laidQty: { text: true, get: function (r) { return r.laidQty; } },
  laidApp: { text: true, get: function (r) { return r.laidApp; } },
  laidCa: { text: true, get: function (r) { return r.laidCa; } },
  sqQty: { text: true, get: function (r) { return r.sqQty; } },
  sqApp: { text: true, get: function (r) { return r.sqApp; } },
  sqCa: { text: true, get: function (r) { return r.sqCa; } },
  activity: { get: function (r) { return r.activity; } },
  score: { get: function (r) { const v = cycleScore_(r); return v === null ? '' : v; } },
  comments: { text: true, get: function (r) { return r.comments; } },
  '': { get: function () { return ''; } }
};
const CHECK_COLS = ['Source sheet', 'Row', 'Animal ID', 'Issue', 'Detail'];

// How old spellings are read during the import. The original text is kept in "Original values".
// A value that is not listed here is imported unchanged and listed in "Import check".
const LEGACY_MAP = {
  quantity: { 'many': 'Many', 'normal': 'Normal', 'few': 'Few', 'none': 'None', 'ok': 'Normal', '-': '' },
  appearance: { 'great': 'Great', 'good': 'Good', 'not bad': 'Not bad', 'bad': 'Bad', 'none': 'None', 'ok': 'Not bad', '-': '' },
  ca: { 'looking good': 'Looking good', 'turned to white': 'Turned to white', 'good': 'Looking good', '-': '' }
};   // water: legacyWater in the settings

/* ------------------------------------------------------------------ entry points */

function doGet() {
  const page = HtmlService.createHtmlOutputFromFile('Index')
    .setTitle(setting_('appName'))
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover');
  if (setting_('faviconUrl')) page.setFaviconUrl(setting_('faviconUrl'));
  return page;
}

function onOpen() {
  SpreadsheetApp.getUi().createMenu(setting_('appName'))
    .addItem('1. Set up sheets', 'setup')
    .addItem('2. Import legacy records', 'importLegacy')
    .addItem('Import photos from Drive folder', 'importPhotos')
    .addItem('Choose photo folder', 'choosePhotoFolder')
    .addItem('Rebuild Vet view', 'rebuildVetView')
    .addToUi();
}

/* ------------------------------------------------------------------ helpers */

function ss_() { return SpreadsheetApp.getActiveSpreadsheet(); }
function tz_() { return ss_().getSpreadsheetTimeZone(); }
function iso_(d) { return Utilities.formatDate(d, tz_(), 'yyyy-MM-dd'); }
function today_() { return iso_(new Date()); }
function now_() { return Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HH:mm:ss'); }
function d_(v) { return v instanceof Date ? iso_(v) : String(v == null ? '' : v).trim(); }
function s_(v) { return String(v == null ? '' : v).trim(); }
function pad_(n) { return (n < 10 ? '0' : '') + n; }

function user_() {
  const email = Session.getActiveUser().getEmail();
  return email ? email.split('@')[0] : 'unknown';
}

function sheet_(name) {
  const sh = ss_().getSheetByName(name);
  if (!sh) throw new Error('Sheet "' + name + '" is missing. Open the spreadsheet and run ' + setting_('appName') + ' > Set up sheets.');
  return sh;
}

function addMonths_(iso, n) {
  const p = iso.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + n, p[2]);
  return d.getFullYear() + '-' + pad_(d.getMonth() + 1) + '-' + pad_(d.getDate());
}

function withLock_(fn) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try { return fn(); } finally { lock.releaseLock(); }
}

function body_(sh, cols) {
  const n = sh.getLastRow() - 1;
  return n > 0 ? sh.getRange(2, 1, n, cols).getValues() : [];
}

function readFrogs_() {
  return body_(sheet_(SHEETS.FROGS), FROG_COLS.length).map(function (r, i) {
    return { row: i + 2, id: Number(r[0]), inColony: s_(r[1]) === 'In colony', tank: r[2] === '' ? '' : Number(r[2]),
      arrival: d_(r[3]), source: s_(r[4]), notes: s_(r[5]), removedOn: d_(r[6]), removalReason: s_(r[9]) };
  }).filter(function (f) { return f.id > 0; });
}

function readRecords_() {
  return body_(sheet_(SHEETS.RECORDS), REC_COLS.length).map(function (r, i) {
    return { row: i + 2, id: s_(r[0]), frog: Number(r[1]), priming: d_(r[2]), collection: d_(r[3]), name: s_(r[4]), water: s_(r[5]),
      sqQty: s_(r[6]), sqApp: s_(r[7]), sqCa: s_(r[8]), laidQty: s_(r[9]), laidApp: s_(r[10]), laidCa: s_(r[11]),
      comments: s_(r[12]), state: s_(r[13]), origin: s_(r[14]), activity: s_(r[19]) };
  }).filter(function (r) { return r.id !== ''; });
}

// One egg type in one cycle, 0 to 1. "None" for either answer means no usable eggs. null when nothing was recorded.
function typeScore_(appearance, quantity) {
  const Q = setting_('quality'), top = function (m) { return Math.max.apply(null, Object.keys(m).map(function (k) { return m[k]; })); };
  const a = Q.appearance[appearance], q = Q.quantity[quantity];
  if (a === undefined && q === undefined) return null;
  if (a === 0 || q === 0) return 0;
  if (a === undefined) return q / top(Q.quantity);
  if (q === undefined) return a / top(Q.appearance);
  return Q.appearanceWeight * a / top(Q.appearance) + (1 - Q.appearanceWeight) * q / top(Q.quantity);
}

// One cycle, 0 to 100, or null when it cannot be scored (not collected, or old free-text values).
function cycleScore_(r) {
  if (!r.collection || r.state === 'Cancelled' || r.state === 'Not used') return null;
  const s = typeScore_(r.sqApp, r.sqQty), l = typeScore_(r.laidApp, r.laidQty);
  if (s === null && l === null) return null;
  const w = setting_('quality').squeezedWeight, v = s === null ? l : l === null ? s : w * s + (1 - w) * l;
  return Math.round(v * 100);
}

// scored: [{date, score}] for one frog. Returns the summary shown in the Frogs tab.
function quality_(scored) {
  scored.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  const Q = setting_('quality'), recent = scored.slice(0, Q.cycles).map(function (x) { return x.score; });
  if (!recent.length) return { score: null, recent: [], cycles: 0, candidate: false, reason: '' };
  const mean = Math.round(recent.reduce(function (t, x) { return t + x; }, 0) / recent.length);
  let reason = '';
  if (scored.length === 1 && mean <= Q.firstThreshold) reason = 'First cycle scored ' + mean;
  else if (scored.length > 1 && mean < Q.threshold) reason = 'Last ' + recent.length + ' cycles average ' + mean;
  return { score: mean, recent: recent, cycles: scored.length, candidate: reason !== '', reason: reason };
}

function isOpen_(r) { return r.state === 'In use' || r.state === 'Recorded'; }
function publicRecord_(r) { const o = {}; Object.keys(r).forEach(function (k) { if (k !== 'row') o[k] = r[k]; }); return o; }

// First four columns of every photo row; the image columns are read only when needed.
function photoIndex_() {
  return body_(sheet_(SHEETS.PHOTOS), 4).map(function (r, i) {
    return { row: i + 2, photoId: s_(r[0]), frog: Number(r[1]), date: d_(r[2]), kind: s_(r[3]) };
  }).filter(function (p) { return p.photoId !== '' && p.kind !== 'cancelled' && p.kind !== 'removed'; });
}

function photoCells_(row) {
  const v = sheet_(SHEETS.PHOTOS).getRange(row, 5, 1, 5).getValues()[0];
  return { fileId: s_(v[0]), thumb: s_(v[1]), pattern: s_(v[2]), emb: s_(v[3]), crop: s_(v[4]) };
}

function buildState_(withThumbs) {
  const today = today_();
  const last = {}, open = {}, scored = {};
  readRecords_().forEach(function (r) {
    if (r.state === 'Cancelled') return;                 // entered by mistake: does not count as a use
    const cs = cycleScore_(r);
    if (cs !== null) (scored[r.frog] = scored[r.frog] || []).push({ date: r.collection, score: cs });
    const used = r.priming || r.collection;
    if (used && used <= today && (!last[r.frog] || used > last[r.frog])) last[r.frog] = used;
    if (isOpen_(r)) open[r.frog] = publicRecord_(r);
  });
  const count = {}, newest = {};
  photoIndex_().forEach(function (p) { count[p.frog] = (count[p.frog] || 0) + 1; newest[p.frog] = p.row; });
  const frogs = readFrogs_().map(function (f) {
    const o = { id: f.id, inColony: f.inColony, tank: f.tank, arrival: f.arrival, source: f.source, notes: f.notes, removedOn: f.removedOn, removalReason: f.removalReason,
      lastPriming: last[f.id] || '', restUntil: last[f.id] ? addMonths_(last[f.id], setting_('restMonths')) : '', open: open[f.id] || null,
      photos: count[f.id] || 0, quality: quality_(scored[f.id] || []) };
    if (withThumbs && f.inColony && newest[f.id]) o.thumb = photoCells_(newest[f.id]).thumb;
    return o;
  });
  const Q = setting_('quality');
  return { user: user_(), today: today, recordTiming: setting_('recordTiming'), restMonths: setting_('restMonths'), tankSize: setting_('tankSize'), primingBatch: setting_('primingBatch'), appName: setting_('appName'),
    options: setting_('options'), removalReasons: setting_('removalReasons'), frogs: frogs,
    qualityRule: { squeezed: Math.round(Q.squeezedWeight * 100), cycles: Q.cycles, threshold: Q.threshold, firstThreshold: Q.firstThreshold } };
}

/* ------------------------------------------------------------------ photos */

function folder_() {
  const props = PropertiesService.getScriptProperties();
  const id = props.getProperty('PHOTO_FOLDER_ID');
  if (id) { try { return DriveApp.getFolderById(id); } catch (e) { /* folder was deleted: make a new one */ } }
  const folder = DriveApp.createFolder(setting_('appName') + ' photos');
  props.setProperty('PHOTO_FOLDER_ID', folder.getId());
  return folder;
}

function fit_(text) { text = s_(text); return text.length > CELL_LIMIT ? '' : text; }

function savePhoto_(frogId, photo, kind, user) {
  const photoId = 'P' + Utilities.getUuid().slice(0, 8);
  const today = today_();
  const bytes = Utilities.base64Decode(String(photo.full).split(',')[1]);
  const file = folder_().createFile(Utilities.newBlob(bytes, 'image/jpeg', 'frog-' + frogId + '_' + today + '_' + photoId + '.jpg'));
  sheet_(SHEETS.PHOTOS).appendRow([photoId, frogId, today, kind, file.getId(), fit_(photo.thumb), fit_(photo.pattern), fit_(photo.emb),
    s_(photo.crop), user, now_()]);
  return photoId;
}

function getFullPhoto(photoId) {
  const hit = photoIndex_().filter(function (p) { return p.photoId === photoId; })[0];
  if (!hit) throw new Error('Photo not found.');
  const blob = DriveApp.getFileById(photoCells_(hit.row).fileId).getBlob();
  return 'data:' + (blob.getContentType() || 'image/jpeg') + ';base64,' + Utilities.base64Encode(blob.getBytes());
}

function photosOf_(index, frogId, limit, withEmb) {
  const mine = index.filter(function (p) { return p.frog === frogId; });
  return mine.slice(Math.max(0, mine.length - limit)).map(function (p) {
    const c = photoCells_(p.row);
    const o = { photoId: p.photoId, date: p.date, kind: p.kind, pattern: c.pattern, thumb: c.thumb, crop: c.crop, hasEmb: c.emb !== '' };
    if (withEmb) o.emb = c.emb;
    return o;
  });
}

/** Newest photos of each listed frog, for the comparison screen and the pattern check. */
function getTankPhotos(ids) {
  const index = photoIndex_(), out = {};
  (ids || []).forEach(function (id) { out[id] = photosOf_(index, Number(id), PHOTOS_PER_FROG, true); });
  return out;
}

/** Every photo the app shows of the frogs in the colony, with its back image and crop, for the roster check. Two columns read in one go each. */
function getRosterPhotos() {
  const index = photoIndex_(), inColony = {};
  if (!index.length) return [];
  readFrogs_().forEach(function (f) { if (f.inColony) inColony[f.id] = true; });
  const sh = sheet_(SHEETS.PHOTOS), n = sh.getLastRow() - 1;
  const pattern = sh.getRange(2, 7, n, 1).getValues(), crop = sh.getRange(2, 9, n, 1).getValues();
  return index.filter(function (p) { return inColony[p.frog]; }).map(function (p) {
    return { photoId: p.photoId, frog: p.frog, date: p.date, kind: p.kind, pattern: s_(pattern[p.row - 2][0]), crop: s_(crop[p.row - 2][0]) };
  });
}

/** Thumbnail and back pattern that the page worked out for a photo that had none. (emb is unused now and stored empty.) */
function savePhotoDerived(list) {
  return withLock_(function () {
    const index = photoIndex_(), sh = sheet_(SHEETS.PHOTOS);
    (list || []).forEach(function (d) {
      const hit = index.filter(function (p) { return p.photoId === d.photoId; })[0];
      if (hit) sh.getRange(hit.row, 6, 1, 4).setValues([[fit_(d.thumb), fit_(d.pattern), fit_(d.emb), s_(d.crop)]]);
    });
    return true;
  });
}

/**
 * Takes a photo out of the app, for example one that turned out to show a different frog.
 * The row and the Drive file stay; Kind becomes "removed", so it is no longer shown or compared.
 */
function removePhoto(frogId, photoId) {
  return withLock_(function () {
    const hit = photoIndex_().filter(function (p) { return p.photoId === photoId && p.frog === Number(frogId); })[0];
    if (!hit) throw new Error('Photo not found. Reload the page and try again.');
    sheet_(SHEETS.PHOTOS).getRange(hit.row, 4).setValue('removed');
    return getFrogDetail(frogId);
  });
}

function addPhoto(frogId, photo) {
  return withLock_(function () {
    savePhoto_(Number(frogId), photo, 'added', user_());
    return getFrogDetail(frogId);
  });
}

/* ------------------------------------------------------------------ page API */

function getState() { return buildState_(false); }

/** Newest thumbnail of each frog in the colony, read in one go. The page asks for this after it is on screen. */
function getThumbs() {
  const index = photoIndex_(), out = {};
  if (!index.length) return out;
  const sh = sheet_(SHEETS.PHOTOS), col = sh.getRange(2, 6, sh.getLastRow() - 1, 1).getValues();
  const inColony = {};
  readFrogs_().forEach(function (f) { if (f.inColony) inColony[f.id] = true; });
  index.forEach(function (p) { const t = s_(col[p.row - 2][0]); if (t && inColony[p.frog]) out[p.frog] = t; });
  return out;
}

function getFrogDetail(frogId) {
  frogId = Number(frogId);
  const records = readRecords_().filter(function (r) { return r.frog === frogId && r.state !== 'Cancelled'; })
    .map(function (r) { const o = publicRecord_(r); o.score = cycleScore_(r); return o; });
  records.sort(function (a, b) { return (b.priming || b.collection) < (a.priming || a.collection) ? -1 : 1; });
  return { id: frogId, records: records, photos: photosOf_(photoIndex_(), frogId, 50, false) };
}

/** payload.items: [{ id, photo: {full, thumb, pattern, emb, crop} | null, match: {tank, best, scores} | null }] */
function savePriming(payload) {
  return withLock_(function () {
    const user = user_(), today = today_(), stamp = now_();
    const byId = {};
    buildState_(false).frogs.forEach(function (f) { byId[f.id] = f; });
    const items = (payload && payload.items) || [];
    if (!items.length) throw new Error('No frogs were selected.');
    const seen = {};
    items.forEach(function (it) {
      const f = byId[it.id];
      if (!f || !f.inColony) throw new Error('#' + it.id + ' is not in the colony.');
      if (seen[it.id]) throw new Error('#' + it.id + ' was selected twice.');
      seen[it.id] = true;
      if (f.open) throw new Error('#' + it.id + ' is already in use (primed ' + f.open.priming + ' by ' + f.open.name + ').');
      if (f.restUntil > today) throw new Error('#' + it.id + ' is resting until ' + f.restUntil + '.');
    });
    const rows = items.map(function (it, i) {
      const r = REC_COLS.map(function () { return ''; });
      r[0] = 'R' + Date.now() + '-' + Utilities.getUuid().slice(0, 6) + i;   /* unique even within one millisecond */ r[1] = it.id; r[2] = today; r[4] = user; r[13] = 'In use'; r[14] = 'app';
      r[16] = stamp; r[17] = stamp; r[18] = user;
      return r;
    });
    const sh = sheet_(SHEETS.RECORDS);
    sh.getRange(sh.getLastRow() + 1, 1, rows.length, REC_COLS.length).setValues(rows);
    items.forEach(function (it) {
      if (it.photo && it.photo.full) savePhoto_(it.id, it.photo, 'priming', user);
      if (it.match) {
        sheet_(SHEETS.MATCH).appendRow([stamp, user, it.match.tank, it.id, it.match.best, it.match.best ? (Number(it.match.best) === Number(it.id) ? 'yes' : 'no') : 'no suggestion',
          JSON.stringify(it.match.scores || {})]);
      }
    });
    saveTiming_(items, byId, payload.client || {}, stamp, user);
    return buildState_(false);
  });
}

// Measurements for the study of the app in use. A missing sheet is created here, so a priming never fails for want of it.
function saveTiming_(items, byId, client, stamp, user) {
  const timed = items.filter(function (it) { return it.timing; });
  if (!setting_('recordTiming') || !timed.length) return;
  const sh = ensureSheet_(SHEETS.TIMING, TIMING_COLS, [1, 2, 3, 6, 13, 14, 17, 19, 20]);   // also adds headings of columns added since
  const num = function (v) { return v === '' || v == null || isNaN(Number(v)) ? '' : Number(v); };
  const yes = function (v) { return v == null ? '' : (v ? 'yes' : 'no'); };
  const rows = timed.map(function (it) {
    const t = it.timing;
    return [stamp, user, APP_VERSION, it.id, byId[it.id].tank, s_(t.opened).slice(0, 30), num(t.photo), num(t.crop), num(t.match), num(t.picked), num(t.saved),
      num(t.photos), yes(t.found), yes(t.moved), num(t.compares), num(t.opens), s_(t.resting).slice(0, 200), num(t.matchMs), s_(t.size).slice(0, 20),
      s_(client.device).slice(0, 300), num(client.matcherLoadMs), num(t.earlier)];
  });
  sh.getRange(sh.getLastRow() + 1, 1, rows.length, TIMING_COLS.length).setValues(rows);
}

function findRecord_(recordId) {
  const rec = readRecords_().filter(function (r) { return r.id === recordId; })[0];
  if (!rec) throw new Error('Record not found. Reload the page and try again.');
  return rec;
}

function pick_(value, allowed) { value = s_(value); return allowed.indexOf(value) >= 0 ? value : ''; }

function touch_(row) { sheet_(SHEETS.RECORDS).getRange(row, 18, 1, 2).setValues([[now_(), user_()]]); }

function saveRecord(recordId, f) {
  return withLock_(function () {
    const rec = findRecord_(recordId);
    if (!isOpen_(rec)) throw new Error('This frog has already been returned. Edit the record from its history instead.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s_(f.collection))) throw new Error('Enter the collection date.');
    const O = setting_('options');
    sheet_(SHEETS.RECORDS).getRange(rec.row, 4, 1, 11).setValues([[f.collection, user_(), pick_(f.water, O.water),
      pick_(f.sqQty, O.quantity), pick_(f.sqApp, O.appearance), pick_(f.sqCa, O.ca),
      pick_(f.laidQty, O.quantity), pick_(f.laidApp, O.appearance), pick_(f.laidCa, O.ca),
      s_(f.comments), 'Recorded']]);
    ensureSheet_(SHEETS.RECORDS, REC_COLS, REC_TEXT);   // adds the Frog activity heading to a sheet made before 1.2.0
    sheet_(SHEETS.RECORDS).getRange(rec.row, 20).setValue(pick_(f.activity, ACTIVITY));
    touch_(rec.row);
    rebuildVet_();
    return buildState_(false);
  });
}

/** After Ca activation and comments stay editable, also after the frog went back to its tank. */
function updateRecord(recordId, f) {
  return withLock_(function () {
    const rec = findRecord_(recordId), sh = sheet_(SHEETS.RECORDS);
    const ca = setting_('options').ca;
    sh.getRange(rec.row, 9).setValue(pick_(f.sqCa, ca));
    sh.getRange(rec.row, 12, 1, 2).setValues([[pick_(f.laidCa, ca), s_(f.comments)]]);
    touch_(rec.row);
    rebuildVet_();
    return buildState_(false);
  });
}

function returnFrog(recordId) {
  return withLock_(function () {
    const rec = findRecord_(recordId);
    if (!isOpen_(rec)) throw new Error('This frog has already been returned.');
    sheet_(SHEETS.RECORDS).getRange(rec.row, 14).setValue(rec.state === 'Recorded' ? 'Returned' : 'Not used');
    touch_(rec.row);
    return buildState_(false);
  });
}

/**
 * Undo for a priming saved by mistake (wrong frog, or the frog was not injected after all).
 * Only before an egg record exists. The row stays in Records as "Cancelled" so there is a trace;
 * the photo taken with that priming is hidden, because it may show a different frog.
 */
function cancelPriming(recordId) {
  return withLock_(function () {
    const rec = findRecord_(recordId);
    if (rec.state !== 'In use') throw new Error('Only a priming without an egg record can be cancelled. Edit the Records sheet for anything else.');
    sheet_(SHEETS.RECORDS).getRange(rec.row, 14).setValue('Cancelled');
    touch_(rec.row);
    const photos = sheet_(SHEETS.PHOTOS);
    photoIndex_().forEach(function (p) {
      if (p.frog === rec.frog && p.kind === 'priming' && p.date === rec.priming) photos.getRange(p.row, 4).setValue('cancelled');
    });
    return buildState_(false);
  });
}

function addFrog(f) {
  return withLock_(function () {
    const frogs = readFrogs_();
    const id = frogs.reduce(function (m, x) { return Math.max(m, x.id); }, 0) + 1;
    const tank = Number(f.tank);
    if (!(tank > 0)) throw new Error('Choose a tank.');
    if (frogs.filter(function (x) { return x.inColony && x.tank === tank; }).length >= setting_('tankSize')) throw new Error('Tank ' + tank + ' is full.');
    sheet_(SHEETS.FROGS).appendRow([id, 'In colony', tank, s_(f.arrival), s_(f.source), s_(f.notes), '', now_(), user_()]);
    if (f.photo && f.photo.full) savePhoto_(id, f.photo, 'registration', user_());
    const state = buildState_(false);
    state.newId = id;
    return state;
  });
}

/** reason: one of the removalReasons setting. note: optional free text, added to the frog's Notes. */
function removeFrog(frogId, reason, note) {
  return withLock_(function () {
    frogId = Number(frogId);
    reason = pick_(reason, setting_('removalReasons'));
    if (!reason) throw new Error('Choose why the frog is being removed.');
    const f = readFrogs_().filter(function (x) { return x.id === frogId; })[0];
    if (!f) throw new Error('Frog not found.');
    if (readRecords_().some(function (r) { return r.frog === frogId && isOpen_(r); })) throw new Error('#' + frogId + ' is in use. Return it first.');
    const sh = sheet_(SHEETS.FROGS);
    sh.getRange(f.row, 2, 1, 2).setValues([['Removed', '']]);
    if (s_(note)) sh.getRange(f.row, 6).setValue(f.notes ? f.notes + '; ' + s_(note) : s_(note));
    sh.getRange(f.row, 7, 1, 4).setValues([[today_(), now_(), user_(), reason]]);
    return buildState_(false);
  });
}

/** Tank exchange, one tank at a time. The layout is the frogs in the colony in ID order, tankSize (setting) per tank
 *  starting at Tank 1, worked out afresh on every call. tank: the tank just filled; its frogs from that layout are recorded in it. */
function applyExchange(tank) {
  return withLock_(function () {
    tank = Number(tank);
    const sh = sheet_(SHEETS.FROGS), stamp = now_(), user = user_();
    const moving = readFrogs_().filter(function (f) { return f.inColony; }).sort(function (a, b) { return a.id - b.id; })
      .filter(function (f, i) { return Math.floor(i / setting_('tankSize')) + 1 === tank && f.tank !== tank; });
    if (!moving.length) throw new Error('No frog is waiting to move into Tank ' + tank + '.');
    moving.forEach(function (f) { sh.getRange(f.row, 3).setValue(tank); sh.getRange(f.row, 8, 1, 2).setValues([[stamp, user]]); });
    rebuildVet_();
    return buildState_(false);
  });
}

/* ------------------------------------------------------------------ Vet view */

function rebuildVetView() { rebuildVet_(); }

// The housing system a tank belongs to (systems setting), or the tank number when no system lists it.
function system_(tank) {
  const t = Number(tank), hit = setting_('systems').filter(function (x) {
    if (!x || !Array.isArray(x.tanks) || x.tanks.length !== 2) throw new Error('systems in Settings: each needs a name and tanks: [first, last].');
    return t >= Number(x.tanks[0]) && t <= Number(x.tanks[1]);
  })[0];
  return hit ? s_(hit.name) : (tank || '');
}

// The vetColumns setting, checked: [{ heading, field }].
function vetColumns_() {
  return setting_('vetColumns').map(function (c) {
    if (!Array.isArray(c) || !(s_(c[1]) in VET_FIELDS)) throw new Error('vetColumns in Settings: "' + c + '" is not [heading, field]. Fields: ' + Object.keys(VET_FIELDS).filter(String).join(', ') + ", or ''.");
    return { heading: s_(c[0]), field: VET_FIELDS[s_(c[1])] };
  });
}

// For the veterinary staff: one row per collected record, columns from the vetColumns setting. Rebuilt whenever a record changes.
function rebuildVet_() {
  const cols = vetColumns_(), frogs = {};
  readFrogs_().forEach(function (f) { frogs[f.id] = f; });
  const rows = readRecords_().filter(function (r) { return r.collection; }).sort(function (a, b) {
    return a.collection < b.collection ? -1 : a.collection > b.collection ? 1 : a.frog - b.frog;
  }).map(function (r) {
    const f = frogs[r.frog] || {};
    return cols.map(function (c) { return c.field.get(r, f); });
  });
  const sh = sheet_(SHEETS.VET), wide = Math.max(cols.length, sh.getLastColumn());
  // The whole sheet is rewritten, headings too, so a change to vetColumns shows on the next rebuild.
  if (sh.getLastRow() > 0) sh.getRange(1, 1, sh.getLastRow(), wide).clearContent();
  sh.getRange(1, 1, 1, cols.length).setValues([cols.map(function (c) { return c.heading; })]);
  cols.forEach(function (c, i) { sh.getRange(1, i + 1, sh.getMaxRows(), 1).setNumberFormat(c.field.text ? '@' : 'General'); });
  if (rows.length) sh.getRange(2, 1, rows.length, cols.length).setValues(rows);
}

/* ------------------------------------------------------------------ setup and import (run from the spreadsheet menu) */

function ensureSheet_(name, cols, textCols) {
  const ss = ss_();
  let sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.getRange(1, 1, 1, cols.length).setValues([cols]);
    sh.setFrozenRows(1);
    // Plain text keeps dates as yyyy-mm-dd and stops Sheets from reinterpreting IDs and image data.
    (textCols || []).forEach(function (c) { sh.getRange(1, c, sh.getMaxRows(), 1).setNumberFormat('@'); });
  } else {
    // A sheet made by an earlier version: add the headings of columns that were introduced since.
    const have = sh.getRange(1, 1, 1, cols.length).getValues()[0];
    cols.forEach(function (c, i) { if (s_(have[i]) === '') sh.getRange(1, i + 1).setValue(c); });
  }
  return sh;
}

function setup() {
  const frogs = ensureSheet_(SHEETS.FROGS, FROG_COLS, [4, 5, 6, 7, 8, 9, 10]);
  ensureSheet_(SHEETS.RECORDS, REC_COLS, REC_TEXT);
  ensureSheet_(SHEETS.PHOTOS, PHOTO_COLS, [1, 3, 4, 5, 6, 7, 8, 9, 10, 11]);
  ensureSheet_(SHEETS.MATCH, MATCH_COLS, [1, 2, 7]);
  if (setting_('recordTiming')) ensureSheet_(SHEETS.TIMING, TIMING_COLS, [1, 2, 3, 6, 13, 14, 17, 19, 20]);
  ensureSheet_(SHEETS.VET, vetColumns_().map(function (c) { return c.heading; }));
  ensureSheet_(SHEETS.CHECK, CHECK_COLS, [5]);
  if (frogs.getLastRow() === 1 && typeof ROSTER !== 'undefined') {
    const stamp = now_();
    const rows = ROSTER.map(function (r) { return [r[0], r[1] ? 'In colony' : 'Removed', r[1] ? r[2] : '', r[3], r[4], r[5], '', stamp, 'setup', '']; });
    frogs.getRange(2, 1, rows.length, FROG_COLS.length).setValues(rows);
  }
  folder_();
}

function legacyDate_(text) {
  const m = s_(text).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m) return '';
  let y = Number(m[3]);
  if (y < 100) y += 2000;
  const iso = y + '-' + pad_(Number(m[1])) + '-' + pad_(Number(m[2]));
  return (y < 2015 || iso > today_()) ? '' : iso;
}

function legacyValue_(kind, raw, note) {
  raw = s_(raw);
  if (raw === '') return '';
  const key = raw.toLowerCase(), map = kind === 'water' ? setting_('legacyWater') : LEGACY_MAP[kind];
  if (!(key in map)) { note('Value not in the current choices, kept as written', kind + ': "' + raw + '"'); return raw; }
  // Reinterpretations are listed for review; completing a short water-source name or dropping a "-" placeholder is not one.
  if (kind !== 'water' && map[key] !== '' && map[key].toLowerCase() !== key) note('Old spelling read as a current choice', kind + ': "' + raw + '" -> "' + map[key] + '"');
  return map[key];
}

/**
 * One-time import of "Form Responses 1" and of the rows in "Shared with ULAM" that the form
 * does not have. Refuses to run twice. Problems are listed in "Import check".
 */
function importLegacy() {
  const ss = ss_(), out = sheet_(SHEETS.RECORDS);
  if (readRecords_().some(function (r) { return r.origin === 'form' || r.origin === 'ulam'; })) {
    throw new Error('Legacy records were already imported. Delete the rows with Origin "form" or "ulam" in Records to import again.');
  }
  const issues = [], rows = [], keys = {}, stamp = now_();

  function add(source, rowNo, id, f, raw, origin) {
    const note = function (issue, detail) { issues.push([source, rowNo, id, issue, detail]); };
    const collection = legacyDate_(f.collection), priming = legacyDate_(f.priming);
    if (!/^\d+$/.test(id)) { note('No Animal ID, row skipped', ''); return; }
    if (s_(f.collection) && !collection) note('Collection date unreadable or in the future, left blank', s_(f.collection));
    if (s_(f.priming) && !priming) note('Priming date unreadable or in the future, left blank', s_(f.priming));
    if (priming && collection && (collection < priming || collection > addMonths_(priming, 1))) note('Priming and collection dates are far apart', priming + ' / ' + collection);
    const key = id + '|' + collection;
    if (keys[key]) note('Same frog and collection date as another row', key);
    keys[key] = true;
    const r = REC_COLS.map(function () { return ''; });
    r[0] = 'L' + ('000' + (rows.length + 1)).slice(-4); r[1] = Number(id); r[2] = priming; r[3] = collection; r[4] = s_(f.name);
    r[5] = legacyValue_('water', f.water, note);
    r[6] = legacyValue_('quantity', f.sqQty, note); r[7] = legacyValue_('appearance', f.sqApp, note); r[8] = legacyValue_('ca', f.sqCa, note);
    r[9] = legacyValue_('quantity', f.laidQty, note); r[10] = legacyValue_('appearance', f.laidApp, note); r[11] = legacyValue_('ca', f.laidCa, note);
    r[12] = s_(f.comments); r[13] = 'Legacy'; r[14] = origin; r[15] = JSON.stringify(raw); r[16] = stamp; r[17] = stamp; r[18] = 'import';
    rows.push(r);
  }

  const form = ss.getSheetByName(LEGACY.FORM);
  if (!form) throw new Error('Sheet "' + LEGACY.FORM + '" was not found.');
  const fv = form.getDataRange().getDisplayValues(), head = fv[0].map(s_);
  const col = function (name) { const i = head.indexOf(name); if (i < 0) throw new Error('Column "' + name + '" was not found in ' + LEGACY.FORM + '.'); return i; };
  const c = { id: col('Animal ID'), name: col('Name'), collection: col('Collection Date'), priming: col('Priming Date'), water: col('MMR H2O source'),
    sqQty: col('Quantity (Squeezed Eggs)'), sqApp: col('Appearance (Squeezed Eggs)'), sqCa: col('After Ca activation (Squeezed Eggs)'),
    laidQty: col('Quantity (Laid Eggs)'), laidApp: col('Appearance (Laid Eggs)'), laidCa: col('After Ca activation (Laid Eggs)'), comments: col('Comments') };
  for (let i = 1; i < fv.length; i++) {
    const v = fv[i];
    if (!v.some(function (x) { return s_(x) !== ''; })) continue;
    const f = {};
    Object.keys(c).forEach(function (k) { f[k] = v[c[k]]; });
    add(LEGACY.FORM, i + 1, s_(f.id), f, f, 'form');
  }

  const shared = ss.getSheetByName(LEGACY.SHARED);
  if (shared) {
    const uv = shared.getDataRange().getDisplayValues();
    for (let i = 1; i < uv.length; i++) {
      const v = uv[i], id = s_(v[0]);
      if (!id) continue;
      const collection = legacyDate_(v[4]);
      if (collection && keys[id + '|' + collection]) continue;      // the form already has this record
      const f = { collection: v[4], priming: '', name: '', laidQty: v[5], laidApp: v[6], laidCa: v[7], sqQty: v[8], sqApp: v[9], sqCa: v[10], water: v[11], comments: v[12] };
      if (collection >= '2025-01-01') issues.push([LEGACY.SHARED, i + 1, id, 'Not in Form Responses although the form was in use (possible date typo)', collection]);
      add(LEGACY.SHARED, i + 1, id, f, f, 'ulam');
    }
  }

  rows.sort(function (a, b) { return a[3] < b[3] ? -1 : a[3] > b[3] ? 1 : a[1] - b[1]; });
  if (rows.length) out.getRange(out.getLastRow() + 1, 1, rows.length, REC_COLS.length).setValues(rows);
  const check = sheet_(SHEETS.CHECK);
  if (check.getLastRow() > 1) check.getRange(2, 1, check.getLastRow() - 1, CHECK_COLS.length).clearContent();
  if (issues.length) check.getRange(2, 1, issues.length, CHECK_COLS.length).setValues(issues);
  rebuildVet_();
}

/**
 * Registers existing photos. Put image files named after the frog ("125.jpg", "125 back.png")
 * in the "import" folder inside "XenoLog photos", then run this from the menu.
 * The page crops them and works out the thumbnail the first time each one is shown.
 */
function importPhotos() {
  const folder = folder_();
  const sub = folder.getFoldersByName('import');
  const src = sub.hasNext() ? sub.next() : folder.createFolder('import');
  const known = {};
  body_(sheet_(SHEETS.PHOTOS), 5).forEach(function (r) { known[s_(r[4])] = true; });
  const frogIds = {};
  readFrogs_().forEach(function (f) { frogIds[f.id] = true; });
  const rows = [], stamp = now_();
  const n = { seen: 0, already: 0, noId: [], notImage: [] };
  (function walk(dir) {                       // also looks inside folders placed in "import"
    const files = dir.getFiles();
    while (files.hasNext()) {
      const file = files.next(), name = file.getName(), m = name.match(/^\s*#?(\d+)/);
      n.seen++;
      if (known[file.getId()]) { n.already++; continue; }
      if (file.getMimeType().indexOf('image/') !== 0) { n.notImage.push(name); continue; }
      if (!m || !frogIds[Number(m[1])]) { n.noId.push(name); continue; }
      rows.push(['P' + Utilities.getUuid().slice(0, 8), Number(m[1]), iso_(file.getDateCreated()), 'registration', file.getId(), '', '', '', '', 'import', stamp]);
    }
    const dirs = dir.getFolders();
    while (dirs.hasNext()) walk(dirs.next());
  })(src);
  rows.sort(function (a, b) { return a[1] - b[1]; });
  const sh = sheet_(SHEETS.PHOTOS);
  if (rows.length) sh.getRange(sh.getLastRow() + 1, 1, rows.length, PHOTO_COLS.length).setValues(rows);
  const few = function (list) { return list.slice(0, 8).join(', ') + (list.length > 8 ? ', ...' : ''); };
  say_('Import photos',
    'Folder searched:\n' + src.getUrl() + '\n\n' +
    'Files found: ' + n.seen + '\nNewly registered: ' + rows.length + '\nAlready registered: ' + n.already +
    (n.noId.length ? '\nName does not start with an ID in the Frogs sheet: ' + n.noId.length + ' (' + few(n.noId) + ')' : '') +
    (n.notImage.length ? '\nNot an image: ' + n.notImage.length + ' (' + few(n.notImage) + ')' : '') +
    (n.seen === 0 ? '\n\nThe folder above is empty. If your photos are in another folder, move them into this one, or run "Choose photo folder" and paste the link of the folder that contains your "import" folder.' : ''));
}

/** Points the app at a photo folder you made yourself (the one that contains "import"). */
function choosePhotoFolder() {
  const ui = SpreadsheetApp.getUi();
  const current = folder_();
  const res = ui.prompt('Choose photo folder', 'Current folder:\n' + current.getUrl() + '\n\nTo use another folder, paste its Google Drive link here. Leave empty to keep the current one.', ui.ButtonSet.OK_CANCEL);
  if (res.getSelectedButton() !== ui.Button.OK || !s_(res.getResponseText())) return;
  const m = s_(res.getResponseText()).match(/[-\w]{25,}/);
  if (!m) { ui.alert('That does not look like a Google Drive folder link.'); return; }
  let picked;
  try { picked = DriveApp.getFolderById(m[0]); } catch (e) { ui.alert('That folder could not be opened. Check that it is a folder link and that you have access.'); return; }
  PropertiesService.getScriptProperties().setProperty('PHOTO_FOLDER_ID', picked.getId());
  ui.alert('New photos will be saved in "' + picked.getName() + '". Photos already registered stay where they are.');
}

function say_(title, text) {
  try { SpreadsheetApp.getUi().alert(title, text, SpreadsheetApp.getUi().ButtonSet.OK); }
  catch (e) { ss_().toast(text, title, 10); }
}

  var toastT;

  /* ---------- photos ---------- */
  function loadTank(t) {
    var ids = inTank(t).map(function (f) { return f.id; });
    return call('getTankPhotos', [ids], true).then(function (r) {
      S.tankPhotos[t] = r;

      if (S.view.name === 'tank' || S.view.name === 'compare') render();

  // Photos registered without a crop (imported files) get one here, once.
  var deriving = Promise.resolve();
  function derive(list) {

        var p = list[i];
        if (p.pattern) continue;

          var r = await Matcher.process(await call('getFullPhoto', [p.photoId], true));
          p.thumb = r.thumb; p.pattern = r.pattern; p.crop = r.crop;

          await rank();

  // Pattern points of a stored photo, worked out once per session from its back image.
  function featuresOf(p) {

  // Counts matching points between the new photo and every earlier photo of each frog still in the tank.
  async function rank() {
    var s = S.shot;

    for (var i = 0; i < frogs.length; i++) {
      var list = refs(tank, frogs[i].id).filter(function (p) { return p.pattern; }), best = null;
      for (var j = 0; j < list.length; j++) {

  /* Crop screen: the photo with a square the person drags over the back. done() gets { full, pattern, thumb, crop }. */
  function cropEdit(r, done) {
    var box = document.getElementById('cropper'), st = { full: r.full, sq: r.sq, w: r.width, h: r.height, crop: r.crop, moved: false };
    function close() { box.hidden = true; box.innerHTML = ''; }
    function place() {
      var f = document.getElementById('crop-frame'), sl = document.getElementById('crop-size'), q = st.sq;
      f.style.left = (q.x / st.w * 100) + '%'; f.style.top = (q.y / st.h * 100) + '%';
      f.style.width = (q.side / st.w * 100) + '%'; f.style.height = (q.side / st.h * 100) + '%';
      sl.value = Math.round(q.side);
    }
    function clamp() {
      var q = st.sq; q.side = Math.max(40, Math.min(q.side, st.w, st.h));
      q.x = Math.max(0, Math.min(q.x, st.w - q.side)); q.y = Math.max(0, Math.min(q.y, st.h - q.side));
    }
    function draw() {
      box.innerHTML = '<div class="crop-in"><header class="top"><h1>Crop to the back</h1></header>' +
        '<p class="note">Drag the square over the back, with the head at the top. Rotate the photo if the frog lies sideways.</p>' +
        '<div class="crop-stage"><img id="crop-img" src="' + st.full + '" alt="The photo you took" draggable="false"><div id="crop-frame"></div></div>' +
        '<label class="field"><span>Size of the square</span><input type="range" id="crop-size" min="' + Math.round(Math.min(st.w, st.h) * 0.15) + '" max="' + Math.min(st.w, st.h) + '"></label>' +
        '<button class="btn" id="crop-ok">Use this crop</button>' +
        '<div class="btnrow"><button class="btn ghost" id="crop-rotate">Rotate 90\u00b0</button><button class="btn ghost" id="crop-cancel">Cancel</button></div></div>';
      box.hidden = false; box.scrollTop = 0; clamp(); place();
      var frame = document.getElementById('crop-frame'), img = document.getElementById('crop-img'), drag = null;
      frame.addEventListener('pointerdown', function (e) { drag = { px: e.clientX, py: e.clientY, x: st.sq.x, y: st.sq.y }; frame.setPointerCapture(e.pointerId); e.preventDefault(); });

        busy(1);
        Matcher.rotate(st.full).then(Matcher.process).then(function (n) { busy(-1); st.full = n.full; st.sq = n.sq; st.w = n.width; st.h = n.height; st.crop = n.crop; st.moved = true; draw(); })
          .catch(function (e) { busy(-1); close(); fail(e); });

        busy(1);

  function shoot(file, done) {

  function takeShot(file, t) {

  function matchNote(t) {

  // The layout is worked out in ID order every time; a tank is marked done on the day its frogs are moved in.
  function vExchange() {

    }).join('');
    var tanks = Object.keys(todo).map(Number).sort(function (a, b) { return a - b; });
    var moved = tanks.reduce(function (n, t) { return n + todo[t].length; }, 0);
    var h = head('Tank exchange', true) + '<p class="note">The ' + act.length + ' frogs in the colony, assigned ' + S.data.tankSize + ' per tank in ID order. ' +

  /* ---------- render and navigation ---------- */
  function render() {
    var app = document.getElementById('app'), v = S.view, h;

    else if (v.name === 'tape') h = vTape(v.ids); else if (v.name === 'inuse') h = vInuse(); else if (v.name === 'use') h = vUse(v.id);
    else if (v.name === 'frogs') h = vFrogs(); else if (v.name === 'frog') h = vFrog(v.id); else if (v.name === 'hist') h = vHist(v.id, v.n);

    var n = inUse().length;
    document.getElementById('tabs').innerHTML = [['priming', 'Priming'], ['inuse', 'In use' + (n ? ' ' + n : '')], ['frogs', 'Frogs']].map(function (t) {
      return '<button data-act="tab" data-id="' + t[0] + '" id="tab-' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button>';
    }).join('');
  }
  function go(view, keepScroll) { S.view = view; S.warn = null; S.confirm = null; S.error = ''; render(); if (!keepScroll) window.scrollTo(0, 0); }
  var home = { priming: 'tanks', inuse: 'inuse', frogs: 'frogs' };
  function openFrog(id, from) {

    return call('getFrogDetail', [id], true).then(function (d) {
      setDetail(d);

      derive(d.photos);
    }).catch(fail);
  }
  function setDetail(d) {
    S.detail = d;
    if (d.photos.length) { d.photos.forEach(function (p) { p.frog = d.id; }); d.photos[d.photos.length - 1].last = true; }
  }
  function recrop(id, p) {
    busy(1);
    call('getFullPhoto', [p.photoId], true).then(Matcher.process).then(function (r) {
      busy(-1);
      cropEdit(r, function (q) {
        busy(1);
        call('savePhotoDerived', [[{ photoId: p.photoId, thumb: q.thumb, pattern: q.pattern, emb: '', crop: 'manual' }]], true).then(function () {
          busy(-1); p.pattern = q.pattern; p.thumb = q.thumb; p.crop = 'manual';
          if (p.last) S.thumbs[id] = q.thumb;
          delete S.tankPhotos[frog(id).tank]; photosChanged(); render(); toast('Crop saved');
        }).catch(function (e) { busy(-1); fail(e); });
      });
    }).catch(function (e) { busy(-1); fail(e); });
  }
  function photosChanged() { if (S.check && S.check.result) S.check.stale = true; }
  // Every photo against every other, as on the check page. Slow on a phone: it can be stopped, and it keeps going while other screens are open.
  async function runCheck() {
    var prev = S.check, c = S.check = { running: true, stop: false, msg: 'Reading the photos...', result: null, stale: false, error: '' };
    var say = function (t) { c.msg = t; var el = document.getElementById('check-msg'); if (el) el.textContent = t; };
    render();
    try {
      var photos = await call('getRosterPhotos', [], true), started = Date.now(), feats = [];
      say('Loading the pattern check...');
      if (!await Matcher.load()) throw new Error('The pattern check could not be loaded. Check the internet connection and try again.');
      for (var i = 0; i < photos.length && !c.stop; i++) {
        say('Reading the back patterns: ' + (i + 1) + ' of ' + photos.length + '...');
        var f = /^data:image\//.test(photos[i].pattern) ? await featuresOf(photos[i]) : null;
        feats[i] = f && f.n >= 4 ? f : null;
      }
      var from = Date.now();
      var pairs = c.stop ? null : await RosterCheck.scoreAll(photos, feats, Matcher.count, function (done, total) {
        var left = done ? Math.round((Date.now() - from) / done * (total - done) / 1000) : null;
        say('Comparing: ' + done + ' of ' + plural(total, 'pair') + (left !== null && done < total ? ', about ' + (left < 90 ? left + ' s' : Math.round(left / 60) + ' min') + ' left' : '') + '...');
      }, function () { return c.stop; });
      if (pairs) {
        var frogs = S.data.frogs.map(function (g) { return { id: g.id, inColony: g.inColony, tank: g.tank }; }), d = new Date();
        c.result = { photos: photos, pairs: pairs, F: RosterCheck.findings(photos, feats, pairs, frogs), secs: Math.round((Date.now() - started) / 100) / 10,
          at: d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() };
      }
    } catch (e) { c.error = (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }
    c.running = false;
    if (!c.result && prev && prev.result) { c.result = prev.result; c.stale = prev.stale; }   // stopped or failed: the last result stays
    if (S.check === c && S.view.name === 'check') render();
  }
  function pick(id) {
    var f = frog(id), s = S.shot, t = f.tank;
    if (status(f).k === 'rest') { S.warn = id; S.since.resting.push(id); render(); return; }
    if (status(f).k !== 'ok') return;
    var item = { id: id, tank: t, photo: null, match: null };
    if (s && s.tank === t) {
      item.photo = { full: s.full, pattern: s.pattern, thumb: s.thumb, emb: '', crop: s.crop };
      // Logged for later review: what the pattern check suggested (nothing, when no frog reached the threshold) and every count.
      if (s.ranks) { item.match = { tank: t, best: s.ranks[0].score >= MATCH_MIN ? s.ranks[0].id : '', scores: {} }; s.ranks.forEach(function (r) { if (r.score != null) item.match.scores[r.id] = r.score; }); }
    } else s = null;
    var tr = S.trial && S.trial.tank === t ? S.trial : { opened: null }, n = S.since;
    item.timing = { opened: tr.opened, first: n.first, photoAt: s && s.photoAt, cropAt: s && s.cropAt, doneAt: s && s.doneAt, pickedAt: Date.now(),
      photos: n.photos, found: s ? s.found : null, moved: s ? s.crop === 'manual' : null, compares: n.compares, opens: n.opens,
      resting: n.resting, matchMs: s && s.rankMs != null ? (s.describeMs || 0) + s.rankMs : null, size: s ? s.size : '' };
    S.trial = null; S.since = fresh();
    S.basket.push(item); S.shot = null; go({ name: 'tanks' }); toast('#' + id + ' added to today\'s priming');
  }
  // One Timing row per frog: the clock time the tank was opened, then seconds from there to each step
  // (negative for a photo taken while another tank was open), and the seconds spent in tanks opened before it.
  function timingRow(tm, savedAt) {
    if (!tm) return null;
    var sec = function (ms) { return ms && tm.opened ? Math.round((ms - tm.opened) / 100) / 10 : ''; };
    var two = function (n) { return (n < 10 ? '0' : '') + n; }, d = tm.opened ? new Date(tm.opened) : null;
    return { opened: d ? d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) + '.' + String(1000 + d.getMilliseconds()).slice(1) : '',
      photo: sec(tm.photoAt), crop: sec(tm.cropAt), match: sec(tm.doneAt), picked: sec(tm.pickedAt), saved: sec(savedAt),
      photos: tm.photos, found: tm.found, moved: tm.moved, compares: tm.compares, opens: tm.opens, resting: tm.resting.join(', '),
      matchMs: tm.matchMs == null ? '' : tm.matchMs, size: tm.size || '', earlier: tm.first && tm.opened ? Math.round((tm.opened - tm.first) / 100) / 10 : '' };
  }
  function reload(quiet) {

      }).catch(function () {});
    }).catch(fail);
  }

      call('getTankPhotos', [[zid]], true).then(function (r) {
        var list = r[zid] || [], p = list[list.length - 1], img = document.getElementById('zoom-img');
        if (p && p.pattern && img) { img.src = p.pattern; document.getElementById('zoom-cap').textContent = p.date + ' · ' + p.kind + ' · returns to Tank ' + zf.tank; }
      }).catch(function () {});
      return;
    }
    var b = e.target.closest('[data-act]'); if (!b || !S.data) return;
    var act = b.dataset.act, id = b.dataset.id, v = S.view, f;
    if (act === 'fileCtx') { S.fileCtx = { kind: b.dataset.kind, id: +id }; return; }   // the label itself opens the camera
    if (act === 'tab') { S.tab = id; S.shot = null; go({ name: home[id] }); reload(true); }
    else if (act === 'back') {
      if (v.name === 'compare') go({ name: 'tank', id: v.tank });
      else if (v.name === 'hist') go({ name: 'frog', id: v.id, from: v.from });
      else if (v.name === 'frog' && v.from === 'check') go({ name: 'check' });
      else { if (v.name !== 'tank') S.shot = null; S.addPhoto = null; go({ name: home[S.tab] }); }   // a photo taken in the wrong tank waits on the list
    }
    else if (act === 'dismiss') { S.error = ''; render(); }
    else if (act === 'dropShot') { S.shot = null; render(); }
    else if (act === 'reload') reload().then(function () { toast('Up to date'); });
    else if (act === 'openTank') {
      var now = Date.now();
      if (S.shot && S.shot.tank !== +id) { S.shot.tank = +id; S.shot.ranks = null; S.shot.ranked = false; }   // compared again with this tank's frogs
      S.trial = { tank: +id, opened: now }; S.since.opens++; if (!S.since.first) S.since.first = now;
      go({ name: 'tank', id: +id }); loadTank(+id); Matcher.load();
    }
    else if (act === 'compare') {
      var tk = v.name === 'compare' ? v.tank : v.id;
      if (v.name !== 'compare') S.since.compares++;
      go({ name: 'compare', tank: tk, id: +id, idx: 99, whole: false }, v.name === 'compare');
    }
    else if (act === 'photo') { v.idx = +id; render(); }
    else if (act === 'big') { S.big = !S.big; render(); }
    else if (act === 'whole') {
      v.whole = !v.whole; render();
      var list = refs(v.tank, v.id), p = list[Math.min(v.idx, list.length - 1)];
      if (v.whole && p && !S.full[p.photoId]) call('getFullPhoto', [p.photoId], true).then(function (src) { S.full[p.photoId] = src; render(); }).catch(function () {});
    }
    else if (act === 'pick') pick(+id);
    else if (act === 'unpick') { S.basket = S.basket.filter(function (x) { return x.id !== +id; }); render(); }
    else if (act === 'savePriming') {
      var on = S.data.recordTiming, savedAt = Date.now(), items = S.basket.map(function (x) { return { id: x.id, photo: x.photo, match: x.match, timing: on ? timingRow(x.timing, savedAt) : null }; });
      var client = on ? { device: navigator.userAgent + ' ' + screen.width + 'x' + screen.height + '@' + (window.devicePixelRatio || 1), matcherLoadMs: Matcher.loadMs() } : null;
      call('savePriming', [{ items: items, client: client }]).then(function (st) {
        S.basket.forEach(function (x) { if (x.photo) S.thumbs[x.id] = x.photo.thumb; delete S.tankPhotos[x.tank]; });
        var ids = S.basket.map(function (x) { return x.id; });
        S.basket = []; applyState(st); go({ name: 'tape', ids: ids });
      }).catch(function (e) { fail(e); reload(true); });
    }
    else if (act === 'openUse') go({ name: 'use', id: +id });
    else if (act === 'ret') {
      f = frog(+id);
      call('returnFrog', [f.open.id]).then(function (st) { applyState(st); go({ name: 'inuse' }); toast('#' + f.id + ' returned to Tank ' + f.tank); }).catch(fail);
    }
    else if (act === 'askCancel') { S.confirm = 'cancel' + id; render(); }
    else if (act === 'cancelPriming') {
      f = frog(+id);
      call('cancelPriming', [f.open.id]).then(function (st) {
        delete S.thumbs[f.id]; delete S.tankPhotos[f.tank]; applyState(st); go({ name: 'inuse' }); toast('Priming of #' + f.id + ' cancelled');
        call('getThumbs', [], true).then(function (t) { Object.keys(t).forEach(function (k) { S.thumbs[k] = t[k]; }); if (S.view.name === 'inuse') render(); }).catch(function () {});
      }).catch(fail);
    }
    else if (act === 'openFrog') openFrog(+id);
    else if (act === 'editHist') go({ name: 'hist', id: v.id, n: +id, from: v.from });
    else if (act === 'checkFrog') openFrog(+id, 'check');
    else if (act === 'runCheck') runCheck();
    else if (act === 'stopCheck') { if (S.check) { S.check.stop = true; S.check.msg = 'Stopping...'; render(); } }
    else if (act === 'recrop') recrop(v.id, S.detail.photos[+id]);
    else if (act === 'askRemovePhoto') { S.confirm = 'photo' + S.detail.photos[+id].photoId; render(); }
    else if (act === 'removePhoto') {
      var fid = v.id, rp = S.detail.photos[+id];
      call('removePhoto', [fid, rp.photoId]).then(function (d) {
        S.confirm = null; setDetail(d); delete S.tankPhotos[frog(fid).tank]; frog(fid).photos = d.photos.length; photosChanged();
        if (rp.last) delete S.thumbs[fid];
        if (S.detail.photos.length) S.thumbs[fid] = S.detail.photos[S.detail.photos.length - 1].thumb || S.thumbs[fid];
        render(); toast('Photo removed');
      }).catch(fail);
    }
    else if (act === 'go') { S.addPhoto = null; go({ name: id }); }
    else if (act === 'askRemove') { S.confirm = +id; render(); }
    else if (act === 'cancel') { S.confirm = null; render(); }
    else if (act === 'askExchange') { S.confirm = 'ex' + id; render(); }
    else if (act === 'applyExchange') call('applyExchange', [+id]).then(function (st) { applyState(st); S.tankPhotos = {}; S.confirm = null; render(); toast('Tank ' + id + ' done'); }).catch(fail);
  });

  document.addEventListener('change', function (e) {
    var el = e.target, file = el.files && el.files[0], ctx = S.fileCtx;
    if (!file || !ctx || (el.id !== 'file-cam' && el.id !== 'file-lib')) return;
    S.fileCtx = null;
    if (ctx.kind === 'shot') takeShot(file, ctx.id);
    else if (ctx.kind === 'newFrog') shoot(file, function (p) { S.addPhoto = p; keepForm(render); });
    else if (ctx.kind === 'addPhoto') {
      var id = ctx.id;
      shoot(file, function (p) {
        busy(1);
        call('addPhoto', [id, { full: p.full, pattern: p.pattern, thumb: p.thumb, emb: '', crop: p.crop }], true)
          .then(function (d) { busy(-1); S.thumbs[id] = p.thumb; delete S.tankPhotos[frog(id).tank]; frog(id).photos++; setDetail(d); photosChanged(); render(); toast('Photo added'); })
          .catch(function (x) { busy(-1); fail(x); });
      });
    }
    el.value = '';
  });
  // Re-rendering the add form would wipe what was typed; carry the values across.
  function keepForm(fn) {
    var keep = {}; ['add-date', 'add-source', 'add-notes', 'add-tank'].forEach(function (k) { var el = document.getElementById(k); if (el) keep[k] = el.value; });
    fn();
    Object.keys(keep).forEach(function (k) { var el = document.getElementById(k); if (el) el.value = keep[k]; });
  }

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target, rec = form.dataset.rec;
    if (form.id === 'rec-form') {
      var id = S.view.id, date = document.getElementById('rec-date').value;
      if (!date) { toast('Enter the collection date'); return; }
      call('saveRecord', [rec, { collection: date, water: checked('water'), sqQty: checked('sqQty'), sqApp: checked('sqApp'), sqCa: checked('sqCa'), laidQty: checked('laidQty'), laidApp: checked('laidApp'), laidCa: checked('laidCa'), activity: checked('activity'), comments: document.getElementById('rec-memo').value }])
        .then(function (st) { applyState(st); go({ name: 'use', id: id }); }).catch(fail);
    } else if (form.id === 'edit-form' || form.id === 'hist-form') {
      var v = S.view;
      call('updateRecord', [rec, { sqCa: checked('sqCa'), laidCa: checked('laidCa'), comments: document.getElementById('edit-memo').value }]).then(function (st) {
        applyState(st); toast('Changes saved');
        if (form.id === 'hist-form') openFrog(v.id); else go({ name: 'use', id: v.id }, true);
      }).catch(fail);
    } else if (form.id === 'remove-form') {
      var rid = +form.dataset.id, reason = checked('removeReason');
      if (!reason) { toast('Choose a reason'); return; }
      call('removeFrog', [rid, reason, document.getElementById('remove-note').value]).then(function (st) { applyState(st); go({ name: 'frogs' }); toast('#' + rid + ' removed'); }).catch(fail);
    } else if (form.id === 'add-form') {
      var p = S.addPhoto;
      call('addFrog', [{ arrival: document.getElementById('add-date').value, source: document.getElementById('add-source').value, notes: document.getElementById('add-notes').value, tank: document.getElementById('add-tank').value,
        photo: p ? { full: p.full, pattern: p.pattern, thumb: p.thumb, emb: '', crop: p.crop } : null }]).then(function (st) {
        if (p) S.thumbs[st.newId] = p.thumb;
        S.addPhoto = null; S.tankPhotos = {}; applyState(st); toast('#' + st.newId + ' added'); openFrog(st.newId);
      }).catch(fail);
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id !== 'frog-search') return;
    var q = e.target.value.replace(/[^0-9]/g, '');
    Array.prototype.forEach.call(document.querySelectorAll('#frog-list .row'), function (r) { r.hidden = !!q && r.dataset.key.indexOf(q) !== 0; });
  });

  Matcher.onStatus(function () { if (S.data && S.view.name === 'tank') render(); });
  render();
  reload();
})();
</script>
</body>
</html>
